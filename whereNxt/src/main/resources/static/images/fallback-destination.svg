<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="60%" stop-color="#2a5298"/>
      <stop offset="100%" stop-color="#7e8ba3"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4e68"/>
      <stop offset="100%" stop-color="#1b2434"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556c8d"/>
      <stop offset="100%" stop-color="#253346"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0d141e"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="400" cy="220" r="70" fill="url(#sunGrad)" opacity="0.9"/>

  <!-- Back Mountains -->
  <polygon points="50,400 240,160 410,400" fill="url(#mountain2)" opacity="0.7"/>
  <polygon points="280,400 460,190 620,400" fill="url(#mountain2)" opacity="0.6"/>
  <polygon points="510,400 660,210 790,400" fill="url(#mountain2)" opacity="0.7"/>

  <!-- Front Mountains -->
  <polygon points="-40,450 160,220 370,450" fill="url(#mountain1)"/>
  <polygon points="340,450 540,250 750,450" fill="url(#mountain1)"/>

  <!-- Ground -->
  <rect y="400" width="800" height="50" fill="url(#groundGrad)"/>

  <!-- Camera / Map pin icon badge in center -->
  <g transform="translate(368, 150)" opacity="0.85">
    <circle cx="32" cy="32" r="30" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2"/>
    <path d="M32 18 C25.37 18 20 23.37 20 30 C20 39 32 47 32 47 C32 47 44 39 44 30 C44 23.37 38.63 18 32 18 Z M32 34 C29.79 34 28 32.21 28 30 C28 27.79 29.79 26 32 26 C34.21 26 36 27.79 36 30 C36 32.21 34.21 34 32 34 Z" fill="#ffffff"/>
  </g>

  <!-- Text -->
  <text x="400" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="500" letter-spacing="0.5">
    Scenic Destination Preview
  </text>
  <text x="400" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Google Places photo currently unavailable for this location
  </text>
</svg>
