spring.application.name=travel-recommendation
server.port=8080

# Gemini API Configuration
# Provide key via environment variable GEMINI_API_KEY or set here
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

# Google Places API Configuration
# Provide key via environment variable GOOGLE_PLACES_API_KEY or set here
google.places.api.key=${GOOGLE_PLACES_API_KEY:}
google.places.api.url=${GOOGLE_PLACES_API_URL:https://places.googleapis.com/v1}
google.places.legacy.url=https://maps.googleapis.com/maps/api/place

# Logging
logging.level.com.travel.recommendation=INFO
logging.level.org.springframework.web=INFO
