# Server Configuration
server.port=8080
spring.application.name=wherenxt-backend

# Static Resources
spring.web.resources.static-locations=classpath:/static/,file:public/,file:./
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=https://generativelanguage.googleapis.com
gemini.api.model=gemini-1.5-flash
gemini.api.timeout-seconds=30

# Wikimedia Commons MediaWiki API Configuration
wikimedia.api.base-url=https://commons.wikimedia.org/w/api.php
wikimedia.api.user-agent=whereNxt-TravelApp/1.0 (https://github.com/wherenxt; travel-app@wherenxt.com)
wikimedia.api.timeout-seconds=10
wikimedia.api.default-thumbnail-width=800

# Logging
logging.level.root=INFO
logging.level.com.wherenxt=INFO
logging.level.org.springframework.web=INFO
